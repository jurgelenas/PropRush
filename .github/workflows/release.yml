name: Release

on:
  push:
    tags: [ 'v[0-9]*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-26.04
    steps:
      - name: Check tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3
          make install-tools

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test-host

      - name: Build
        run: make build VERSION="${GITHUB_REF_NAME#v}" ZIP_NAME="fpv-sim-$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without an explicit start tag GitHub may diff against the nightly prerelease.
          args=()
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            args+=(--notes-start-tag "$prev")
          fi
          notes=$(cat <<EOF2
          | Radio | Download |
          |-------|----------|
          | EdgeTX 2.12+, black-and-white screen | \`fpv-sim-$GITHUB_REF_NAME.zip\` |

          Extract the zip onto the SD card root, then open **FPV Sim** from the Tools menu.
          EOF2
          )
          # --notes is placed before the generated notes.
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes \
            --latest \
            "${args[@]}"
