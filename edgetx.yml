package:
  id: github.com/jurgelenas/proprush
  name: PropRush
  description: FPV drone flying simulator that runs on the radio
  authors:
  - name: Jurg
  urls:
  - name: Repository
    url: https://github.com/jurgelenas/proprush
  keywords:
  - fpv
  - simulator
  - game
  license: GPL-3.0-only
  source_dir: src
  min_edgetx_version: '2.12.4'
  # Black-and-white screens only until the colour edition
  capabilities:
    display:
      type: bw
tools:
- name: PropRush
  path: SCRIPTS/TOOLS/PropRush
  # Settings and best laps the tool saves on the radio
  exclude:
  - '*.txt'
